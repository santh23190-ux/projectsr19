<!-- LOCK SCREEN (3-step verification) -->
<div class="lock" id="lockScreen">
  <div class="lockCard" id="lockCard">
    <div class="sparkle"></div>

    <div class="badge" style="justify-content:center;margin-bottom:10px;">
      Secret entry ✨
    </div>

    <div class="lockTitle" id="lockTitle">Unlock the birthday page</div>
    <p class="lockSub" id="lockSub">Hint: your favourite series</p>

    <div class="lockRow">
      <input class="lockInput" id="codeInput" type="password" placeholder="Password" />
      <button class="primary" id="unlockBtn">Next</button>
    </div>

    <div class="lockError" id="lockError">Wrong answer — try again.</div>
    <div class="lockHint" id="lockHint">Step 1 of 3</div>
  </div>
</div>
